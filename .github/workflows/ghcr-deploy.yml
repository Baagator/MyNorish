name: Build and Publish to GHCR

on:
  push:
    branches:
      - main

concurrency:
  group: ghcr-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_node-ci.yml
    secrets: inherit

  build:
    name: linux/${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "arm64"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Native runner per architecture, same as upstream Norish's build:
      # no QEMU, so no emulation slowdown on the arm64 leg.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package versions
        id: versions
        run: |
          report="$(node tooling/monorepo/scripts/print-package-versions.mjs)"
          echo "report=${report}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            NORISH_VERSION_REPORT_JSON=${{ steps.versions.outputs.report }}
          outputs: type=image,name=ghcr.io/baagator/mynorish,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/baagator/mynorish-buildcache:${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/baagator/mynorish-buildcache:${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per-arch pushes above land as bare digests with no tag attached. This job
  # assembles them into the multi-arch manifest that `docker compose pull`
  # actually resolves on the Pi.
  merge:
    name: Manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          shopt -s nullglob

          refs=()
          for digest in *; do refs+=("ghcr.io/baagator/mynorish@sha256:${digest}"); done
          if [ ${#refs[@]} -eq 0 ]; then
            echo "No digests were produced by the build jobs." >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "ghcr.io/baagator/mynorish:latest" \
            --tag "ghcr.io/baagator/mynorish:sha-${{ github.sha }}" \
            "${refs[@]}"

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ghcr.io/baagator/mynorish:latest
